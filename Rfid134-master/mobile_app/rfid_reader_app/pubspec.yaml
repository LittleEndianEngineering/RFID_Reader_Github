name: rfid_reader_app
description: RFID reader companion app.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  fl_chart: 0.68.0
  flutter_blue_plus: 1.36.8
  gallery_saver: 2.3.2
  path_provider: 2.1.5
  share_plus: 7.2.2
  timezone: 0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: 0.13.1
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/EB_icon.png
    - assets/images/EB_icon.jpeg
    - assets/images/EB_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/EB_icon.png
  remove_alpha_ios: true
