name: Build customer macOS and Linux dashboards
on:
  workflow_dispatch:
  push:
    branches:
      - 'customer/windows-dashboard-*'
    paths:
      - 'Rfid134-master/dashboard/customer/**'
      - '.github/workflows/build-customer-dashboard-unix.yml'
permissions:
  contents: read
jobs:
  native-executable:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            target: macos-arm64
          - runner: macos-15-intel
            architecture: x64
            target: macos-x64
          - runner: ubuntu-22.04
            architecture: x64
            target: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: Rfid134-master/dashboard/customer
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: ${{ matrix.architecture }}
      - name: Install Linux desktop test libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-tk libx11-6 libxext6 libxrender1 libxss1
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build and test macOS app
        if: runner.os == 'macOS'
        run: python build_native.py --target '${{ matrix.target }}'
      - name: Build and test Linux executable with a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum python build_native.py --target '${{ matrix.target }}'
      - name: Upload package and verification results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RFIDDashboard-${{ matrix.target }}
          path: Rfid134-master/dashboard/customer/dist/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RFIDDashboard-${{ matrix.target }}-diagnostics
          path: |
            Rfid134-master/dashboard/customer/dist/${{ matrix.target }}/*.json
            Rfid134-master/dashboard/customer/dist/${{ matrix.target }}/*.log
            Rfid134-master/dashboard/customer/build/native-work/RFIDDashboard/warn-RFIDDashboard.txt
          if-no-files-found: ignore
          retention-days: 7
